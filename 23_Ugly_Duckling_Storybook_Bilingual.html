<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>The Ugly Duckling Storybook | جوجه‌اردک زشت</title>
<style>
  :root{
    --ink:#2E3A3F; --ink-soft:#5B6B70; --card:#FFFFFF;
    --coral:#F0876B; --sun:#FFD873; --purple:#9C7FB0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Tahoma, 'Segoe UI', sans-serif;
    background:linear-gradient(180deg,#FFF6E5 0%,#C3E4F5 60%,#CDEADB 100%);
    min-height:100vh; display:flex; justify-content:center; padding:20px 14px;
  }
  .stage{ width:100%; max-width:480px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .title{ font-size:19px; font-weight:700; color:var(--ink); line-height:1.5; }
  .title .sub{ display:block; font-size:12px; font-weight:400; color:var(--ink-soft); }
  button.langToggle{
    font-family:Tahoma, sans-serif; font-size:14px; font-weight:700; color:var(--ink);
    background:#fff; border:2px solid var(--sun); border-radius:999px;
    padding:8px 16px; cursor:pointer; white-space:nowrap; transition:transform .12s ease;
  }
  button.langToggle:active{ transform:scale(0.95); }
  .book-card{
    background:var(--card); border-radius:32px; padding:0; overflow:hidden;
    box-shadow:0 14px 36px rgba(46,58,63,0.15); animation:pop .35s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .stage-svg{ display:block; width:100%; height:auto; }
  .page-body{ padding:22px 24px 26px; }
  .page-num{ font-size:12px; font-weight:700; color:var(--coral); letter-spacing:0.5px; margin-bottom:8px; }
  .story-text{ font-size:18px; font-weight:600; line-height:1.95; color:#1F2A2E; margin:0; min-height:140px; }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px 22px; gap:10px; }
  button.nav{
    font-family:Tahoma, sans-serif; font-size:15px; font-weight:700;
    border:none; border-radius:999px; padding:13px 22px; cursor:pointer; transition:transform .12s ease;
  }
  button.nav:active{ transform:scale(0.95); }
  button.nav.prevBtn{ background:#EFEFEF; color:var(--ink-soft); }
  button.nav.nextBtn{ background:var(--coral); color:#fff; }
  button.nav.restartBtn{ background:var(--purple); color:#fff; }
  button.nav:disabled{ opacity:0; pointer-events:none; }
  .dots{ display:flex; gap:5px; justify-content:center; padding-bottom:14px; flex-wrap:wrap; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#D8D8D8; }
  .dot.active{ background:var(--coral); width:18px; border-radius:4px; transition:all .2s ease; }
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="title" id="titleBox"></div>
    <button class="langToggle" onclick="toggleLang()" id="langBtn">EN</button>
  </div>
  <div class="book-card">
    <div id="imgBox"></div>
    <div class="page-body">
      <div class="page-num" id="pageNum"></div>
      <p class="story-text" id="storyText"></p>
    </div>
    <div class="dots" id="dots"></div>
    <div class="nav-row">
      <button class="nav prevBtn" id="prevBtn" onclick="prevPage()">◂</button>
      <button class="nav nextBtn" id="nextBtn" onclick="nextPage()">▸</button>
    </div>
  </div>
</div>

<script>
let lang = "fa";
let idx = 0;

const ui = {
  fa: { title:"جوجه‌اردک زشت", sub:"نوشته هانس کریستین اندرسن", prev:"قبلی", next:"بعدی", restart:"از اول 🔁", page:"صفحه" },
  en: { title:"The Ugly Duckling", sub:"by Hans Christian Andersen", prev:"Prev", next:"Next", restart:"Restart 🔁", page:"Page" }
};

const GRAY = "#ADB7BA", YELLOW = "#FFE066", CREAM = "#FFF6E3", WHITE = "#FFFFFF";
const VB_W = 480, VB_H = 320;

/* ---------- Big, cute, front-facing bird with pose support ---------- */
function bird(cx, cy, scale, bodyColor, opts){
  opts = opts || {};
  const neckLong = opts.neckLong || false;
  const eyesClosed = opts.eyesClosed || false;
  const tears = opts.tears || false;
  const flap = opts.flap || false;
  const tilt = opts.tilt || 0;
  const headY = neckLong ? -78 : -8;
  const neck = neckLong
    ? `<path d="M0,-18 Q22,-50 6,-76" stroke="#2E3A3F" stroke-width="20" fill="none" stroke-linecap="round"/>
       <path d="M0,-18 Q22,-50 6,-76" stroke="${bodyColor}" stroke-width="15" fill="none" stroke-linecap="round"/>`
    : "";
  const eyeR = 5.2;
  const eyes = eyesClosed
    ? `<path d="M-10,${headY-3} q6,6 12,0" stroke="#2E3A3F" stroke-width="2.4" fill="none" stroke-linecap="round"/>
       <path d="M4,${headY-3} q6,6 12,0" stroke="#2E3A3F" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="-4" cy="${headY-2}" r="${eyeR}" fill="#2E3A3F"/><circle cx="-2" cy="${headY-4}" r="1.6" fill="#fff"/>
       <circle cx="11" cy="${headY-2}" r="${eyeR}" fill="#2E3A3F"/><circle cx="13" cy="${headY-4}" r="1.6" fill="#fff"/>`;
  const blush = `<ellipse cx="-14" cy="${headY+9}" rx="6" ry="4" fill="#F28FB8" opacity="0.75"/>
                 <ellipse cx="22" cy="${headY+9}" rx="6" ry="4" fill="#F28FB8" opacity="0.75"/>`;
  const tearMark = tears ? `<ellipse cx="-8" cy="${headY+14}" rx="3" ry="6" fill="#8FC1D6" opacity="0.9"/>` : "";
  const wings = flap
    ? `<path d="M-22,30 Q-60,14 -56,-30" fill="none" stroke="#2E3A3F" stroke-width="20" stroke-linecap="round"/>
       <path d="M-22,30 Q-60,14 -56,-30" fill="none" stroke="${bodyColor}" stroke-width="15" stroke-linecap="round"/>
       <path d="M22,30 Q60,14 56,-30" fill="none" stroke="#2E3A3F" stroke-width="20" stroke-linecap="round"/>
       <path d="M22,30 Q60,14 56,-30" fill="none" stroke="${bodyColor}" stroke-width="15" stroke-linecap="round"/>`
    : `<ellipse cx="-27" cy="42" rx="11" ry="18" fill="${bodyColor}" stroke="#2E3A3F" stroke-width="2.5" transform="rotate(-18 -27 42)"/>
       <ellipse cx="27" cy="42" rx="11" ry="18" fill="${bodyColor}" stroke="#2E3A3F" stroke-width="2.5" transform="rotate(18 27 42)"/>`;
  const shadow = flap ? "" : `<ellipse cx="0" cy="${neckLong?70:58}" rx="34" ry="8" fill="#2E3A3F" opacity="0.10"/>`;
  const OUT = "#2E3A3F";
  return `<g transform="translate(${cx},${cy}) rotate(${tilt}) scale(${scale})">
    ${shadow}${neck}
    <ellipse cx="0" cy="38" rx="30" ry="26" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <ellipse cx="6" cy="48" rx="22" ry="13" fill="#000000" opacity="0.10"/>
    <ellipse cx="-9" cy="26" rx="13" ry="9" fill="#FFFFFF" opacity="0.30"/>
    ${wings}
    <circle cx="4" cy="${headY}" r="26" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <ellipse cx="6" cy="${headY+12}" rx="18" ry="8" fill="#000000" opacity="0.08"/>
    <ellipse cx="-6" cy="${headY-10}" rx="10" ry="7" fill="#FFFFFF" opacity="0.38"/>
    <polygon points="-11,${headY+9} 14,${headY+9} 2,${headY+22}" fill="#F0932B" stroke="${OUT}" stroke-width="2"/>
    <ellipse cx="-2" cy="${headY+12}" rx="4" ry="2" fill="#FFC773" opacity="0.7"/>
    ${blush}${eyes}${tearMark}
    <ellipse cx="-10" cy="62" rx="8" ry="4" fill="#F0932B" stroke="${OUT}" stroke-width="2"/>
    <ellipse cx="10" cy="62" rx="8" ry="4" fill="#F0932B" stroke="${OUT}" stroke-width="2"/>
  </g>`;
}
function ripple(cx,cy,w){
  return `<g opacity="0.55">
    <path d="M${cx-w},${cy} q${w*0.4},-7 ${w*0.8},0 t${w*0.8},0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M${cx-w*0.7},${cy+10} q${w*0.35},-6 ${w*0.7},0 t${w*0.7},0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>`;
}
function motionLines(cx,cy,len,count,gap,angle){
  let s = `<g transform="rotate(${angle} ${cx} ${cy})" opacity="0.5">`;
  for(let i=0;i<count;i++){
    s += `<line x1="${cx-30-i*gap}" y1="${cy+i*6-6}" x2="${cx-30-i*gap-len}" y2="${cy+i*6-6}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
  }
  return s + `</g>`;
}

function flyingBird(cx,cy,scale,bodyColor){
  const OUT = "#2E3A3F";
  return `<g transform="translate(${cx},${cy}) scale(${scale})">
    <path d="M-18,-4 Q-56,-34 -90,-10 Q-58,3 -22,9 Z" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <path d="M18,-4 Q56,-34 90,-10 Q58,3 22,9 Z" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <ellipse cx="0" cy="4" rx="23" ry="15" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <ellipse cx="4" cy="9" rx="14" ry="7" fill="#000000" opacity="0.08"/>
    <ellipse cx="-7" cy="-2" rx="9" ry="6" fill="#FFFFFF" opacity="0.3"/>
    <path d="M-20,9 L-33,19 L-16,14 Z" fill="${bodyColor}" stroke="${OUT}" stroke-width="2"/>
    <path d="M14,-8 Q32,-32 20,-55" stroke="${OUT}" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M14,-8 Q32,-32 20,-55" stroke="${bodyColor}" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="19" cy="-56" r="10" fill="${bodyColor}" stroke="${OUT}" stroke-width="3"/>
    <ellipse cx="15" cy="-60" rx="4" ry="3" fill="#FFFFFF" opacity="0.4"/>
    <polygon points="27,-56 38,-53 27,-50" fill="#F0932B" stroke="${OUT}" stroke-width="1.8"/>
    <circle cx="23" cy="-58" r="2" fill="#2E3A3F"/>
    <circle cx="24" cy="-59.5" r="0.8" fill="#fff"/>
  </g>`;
}

function reflect(innerSvg, waterY){
  return `<g transform="translate(0,${2*waterY}) scale(1,-1)" opacity="0.32">${innerSvg}</g>`;
}
function grad(id,c1,c2){ return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient>`; }
function sun(cx,cy,r,c){ return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`; }
function snow(cx,cy,r){ return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>`; }
function flower(cx,cy,c,s){ s=s||1; return `<g transform="translate(${cx},${cy}) scale(${s})"><circle cx="0" cy="0" r="6" fill="${c}"/><circle cx="-8" cy="-3" r="5" fill="${c}"/><circle cx="8" cy="-3" r="5" fill="${c}"/><circle cx="0" cy="0" r="3" fill="#FFD873"/></g>`; }
function cloud(cx,cy,s){ return `<g transform="translate(${cx},${cy}) scale(${s})" opacity="0.9">
  <ellipse cx="0" cy="0" rx="26" ry="15" fill="#fff"/><ellipse cx="20" cy="-5" rx="18" ry="13" fill="#fff"/><ellipse cx="-20" cy="-3" rx="16" ry="11" fill="#fff"/></g>`; }
function fire(cx,cy,scale){
  return `<g transform="translate(${cx},${cy}) scale(${scale})">
    <path d="M0,24 Q-17,12 -7,-5 Q-2,3 0,-7 Q5,3 10,-5 Q19,12 0,24Z" fill="#F0A93B"/>
    <path d="M0,19 Q-9,12 -3,0 Q1,5 2,-2 Q7,5 11,0 Q13,12 0,19Z" fill="#FFD873"/>
  </g>`;
}
function handsHold(cx,cy,scale){
  return `<g transform="translate(${cx},${cy}) scale(${scale})">
    <path d="M-38,13 Q-38,-18 0,-18 Q38,-18 38,13 L30,28 Q0,38 -30,28 Z" fill="#E9B98A"/>
  </g>`;
}
function ground(c){ return `<ellipse cx="${VB_W/2}" cy="${VB_H}" rx="300" ry="70" fill="${c}"/>`; }
function sky(id,c1,c2){ return `<defs>${grad(id,c1,c2)}</defs><rect width="${VB_W}" height="${VB_H}" fill="url(#${id})"/>`; }
function svgOpen(){ return `<svg class="stage-svg" viewBox="0 0 ${VB_W} ${VB_H}" xmlns="http://www.w3.org/2000/svg">`; }

/* ---------- Scenes ---------- */
function sceneNest(){
  return `${svgOpen()}${sky('g1','#FFD98A','#FFBE5C')}
  ${sun(395,55,38,'#FFF4D6')}${ground('#9BD47E')}
  <ellipse cx="320" cy="245" rx="85" ry="25" fill="#D9A866"/>
  <ellipse cx="310" cy="230" rx="18" ry="23" fill="#EDE6D6" stroke="#CBBE98" stroke-width="2.5"/>
  ${bird(140,200,1.4,CREAM)}
  ${bird(235,255,0.55,YELLOW)}${bird(270,260,0.5,YELLOW)}${bird(255,235,0.48,YELLOW)}
  </svg>`;
}
function sceneBigEgg(){
  return `${svgOpen()}${sky('g2','#FFD98A','#FFBE5C')}
  ${sun(395,55,38,'#FFF4D6')}${ground('#9BD47E')}
  ${bird(130,195,1.25,CREAM)}
  ${bird(210,250,0.5,YELLOW)}${bird(235,255,0.48,YELLOW)}
  <path d="M320,220 L332,233 L318,243" stroke="#CBBE98" stroke-width="3" fill="none"/>
  ${bird(340,245,1.35,GRAY)}
  </svg>`;
}
function sceneFarmMock(){
  return `${svgOpen()}${sky('g3','#FFD98A','#FFBE5C')}
  ${sun(395,50,32,'#FFF4D6')}${ground('#9BD47E')}
  <text x="100" y="140" font-size="44" text-anchor="middle">🐓</text>
  <text x="180" y="150" font-size="44" text-anchor="middle">🐷</text>
  <text x="100" y="92" font-size="28" text-anchor="middle">😮</text>
  <text x="180" y="102" font-size="28" text-anchor="middle">😏</text>
  ${bird(300,255,0.55,YELLOW)}${bird(325,258,0.5,YELLOW)}
  ${bird(340,240,1.5,GRAY)}
  </svg>`;
}
function scenePondSwim(){
  return `${svgOpen()}${sky('g4','#C3E4F5','#7BC4B0')}
  ${sun(405,50,26,'#FFE49A')}${ground('#5FAFC4')}
  ${ripple(135,232,46)}${ripple(220,268,34)}${ripple(260,248,30)}${ripple(335,260,55)}
  ${bird(135,220,1.15,CREAM,{tilt:-5})}
  ${bird(220,260,0.55,YELLOW,{tilt:6})}${bird(260,245,0.5,YELLOW,{tilt:-6})}
  ${bird(335,248,1.35,GRAY,{tilt:4})}
  </svg>`;
}
function scenePondAlone(){
  return `${svgOpen()}${sky('g5','#C3E4F5','#7BC4B0')}
  ${sun(405,50,26,'#FFE49A')}${ground('#5FAFC4')}
  ${ripple(345,250,55)}
  ${bird(110,235,0.75,CREAM)}${bird(165,255,0.5,YELLOW)}
  ${bird(340,235,1.65,GRAY,{tears:true,tilt:3})}
  </svg>`;
}
function sceneForestSwans(){
  return `${svgOpen()}${sky('g6','#FFC374','#E08A2E')}
  <ellipse cx="60" cy="280" rx="100" ry="170" fill="#D98A4A" opacity="0.5"/>
  <ellipse cx="430" cy="280" rx="110" ry="180" fill="#C9763A" opacity="0.5"/>
  ${motionLines(165,75,34,3,14,20)}
  ${flyingBird(165,75,0.62,WHITE)}
  ${motionLines(255,48,30,3,13,15)}
  ${flyingBird(255,48,0.56,WHITE)}
  ${motionLines(335,78,28,3,12,18)}
  ${flyingBird(335,78,0.54,WHITE)}
  ${bird(240,250,1.65,GRAY)}
  </svg>`;
}
function sceneWinterAlone(){
  return `${svgOpen()}${sky('g7','#C0DCEC','#8FB4CC')}
  ${ground('#D8ECF5')}
  ${snow(60,45,5)}${snow(120,80,4)}${snow(400,55,5)}${snow(440,100,4)}${snow(220,30,4)}${snow(330,110,5)}
  ${bird(240,245,1.7,GRAY)}
  </svg>`;
}
function sceneRescueWarm(){
  return `${svgOpen()}${sky('g8','#F7C79E','#EEA366')}
  ${fire(400,235,1.9)}
  ${handsHold(220,235,1.7)}
  ${bird(220,200,1.15,GRAY)}
  </svg>`;
}
function sceneSpringReturn(){
  return `${svgOpen()}${sky('g9','#F2CCE3','#A8D9BE')}
  ${sun(405,50,24,'#FFE49A')}${ground('#8BCBA4')}
  ${flower(75,255,'#F3A6C9',1.1)}${flower(415,260,'#F3A6C9',1.1)}
  ${ripple(165,245,40)}${ripple(315,248,38)}
  ${bird(165,232,0.78,WHITE,{neckLong:true,tilt:-6})}
  ${bird(315,235,0.72,WHITE,{neckLong:true,tilt:6})}
  ${bird(240,250,1.6,GRAY)}
  </svg>`;
}
function sceneReveal(){
  const waterY = 300;
  return `${svgOpen()}${sky('g10','#F2CCE3','#A8D9BE')}
  ${sun(405,50,24,'#FFE49A')}
  <ellipse cx="240" cy="${waterY}" rx="300" ry="55" fill="#8BCBA4"/>
  ${flower(75,250,'#F3A6C9',1.1)}${flower(415,255,'#F3A6C9',1.1)}
  ${ripple(150,225,30)}${ripple(330,228,28)}
  ${bird(150,222,0.75,WHITE,{neckLong:true,tilt:-6})}
  ${bird(330,225,0.7,WHITE,{neckLong:true,tilt:6})}
  ${reflect(bird(240,220,1.4,WHITE,{neckLong:true}), waterY)}
  ${bird(240,220,1.4,GRAY)}
  </svg>`;
}
function sceneFlyAway(){
  return `${svgOpen()}${sky('g11','#C3E4F5','#CDEADB')}
  ${cloud(110,80,1.2)}${cloud(400,60,1)}${cloud(230,40,0.8)}
  ${motionLines(200,165,55,4,16,25)}
  ${flyingBird(240,150,1.7,WHITE)}
  </svg>`;
}

const pages = [
  { img: sceneNest(),
    text:{fa:"تابستان بود. توی یه مزرعه‌ی آفتابی، یک خانم اردک زیبا روی تخم‌هاش نشسته بود و منتظر بود جوجه‌هاش به دنیا بیان. آفتاب هم کم‌کم خسته شد و داشت جاش رو می‌داد به غروب که ناگهان یکی‌یکی تخم‌ها شروع کردن به شکستن و جوجه‌های زرد کوچولو بیرون اومدن. ولی یه تخم که بزرگ‌تر از بقیه بود، انگار تصمیم نداشت بشکنه.",
        en:"It was summer. On a sunny farm, a beautiful mother duck sat on her eggs, waiting for her ducklings to be born. The sun, too, was growing tired and slowly giving way to sunset, when suddenly, one by one, the eggs began to crack, and tiny yellow ducklings came out. But one egg was bigger than the rest, as if it had no intention of breaking."} },
  { img: sceneBigEgg(),
    text:{fa:"خانم اردک رفت سراغش و با نوکش غلتش داد و تق‌تق بهش چند تا ضربه کوچولو زد. کمی بعد بالاخره اون تخم بزرگ باز شد. یه جوجه بیرون اومد که خیلی با بقیه فرق داشت، بزرگ، خاکستری، و کمی دست‌وپاچلفتی بود.",
        en:"The mother duck went over to it, gently rolled it with her beak, and gave it a few soft pecks. A little while later, the big egg finally opened. Out came a duckling who looked very different from the others — big, gray, and a little clumsy."} },
  { img: sceneFarmMock(),
    text:{fa:"بقیه حیوان‌های مزرعه گفتن: «این یکی چقدر بزرگ و عجیبه!»",
        en:"The other animals on the farm said, \"How big and strange this one is!\""} },
  { img: scenePondSwim(),
    text:{fa:"خانم اردک بچه‌هاش رو برد کنار برکه. همه‌ی جوجه‌ها خوب شنا کردن، حتی اون جوجه‌ی خاکستری بزرگ. ولی مرغ‌ها و اردک‌های دیگه بازم بهش می‌خندیدن و رهاش نمی‌کردن، چون شکلش فرق داشت.",
        en:"The mother duck took her children down to the pond. All the ducklings swam well, even the big gray one. But the other hens and ducks still laughed at him and wouldn't let him be, because he looked different."} },
  { img: scenePondAlone(),
    text:{fa:"می‌گفتن: «برو، تو خیلی زشتی، حق نداری اینجا بمونی!» جوجه‌ی بیچاره خیلی غمگین و تنها شد. تصمیم گرفت از مزرعه بره و یه جایی رو پیدا کنه که قبولش کنن.",
        en:"They said, \"Go away, you're too ugly, you have no right to stay here!\" The poor duckling became very sad and lonely. He decided to leave the farm and find a place where he would be accepted."} },
  { img: sceneForestSwans(),
    text:{fa:"از دشت‌ها و جنگل‌ها رد شد. پاییز آروم‌آروم از راه رسید. یه روز صبح زود یه دسته پرنده‌ی سفید و زیبا رو دید که توی آسمون پرواز می‌کردن. باوقار و آزاد. جوجه یه حس عجیب توی دلش احساس کرد، اما دلیلش رو نمی‌دونست.",
        en:"He passed through fields and forests. Autumn slowly arrived. One early morning, he saw a flock of beautiful white birds flying in the sky. Graceful and free. The duckling felt a strange feeling in his heart, but he didn't know why."} },
  { img: sceneWinterAlone(),

function render(){
  const t = ui[lang];
  document.getElementById("titleBox").innerHTML = `${t.title}<span class="sub">${t.sub}</span>`;
  const p = pages[idx];
  document.getElementById("imgBox").innerHTML = p.img;
  document.getElementById("pageNum").textContent = `${t.page} ${idx+1} / ${pages.length}`;
  document.getElementById("storyText").innerHTML = p.text[lang].replace(/\n/g,"<br><br>");
  document.getElementById("prevBtn").disabled = (idx === 0);
  const nextBtn = document.getElementById("nextBtn");
  if (idx === pages.length - 1){
    nextBtn.textContent = t.restart; nextBtn.className = "nav restartBtn";
    nextBtn.onclick = () => { idx = 0; render(); };
  } else {
    nextBtn.textContent = t.next; nextBtn.className = "nav nextBtn";
    nextBtn.onclick = nextPage;
  }
  document.getElementById("prevBtn").textContent = t.prev;
  document.getElementById("dots").innerHTML = pages.map((_,i)=>`<span class="dot${i===idx?' active':''}"></span>`).join("");
}
function nextPage(){ if(idx < pages.length-1){ idx++; render(); scrollTop(); } }
function prevPage(){ if(idx > 0){ idx--; render(); scrollTop(); } }
function scrollTop(){ window.scrollTo({top:0, behavior:"smooth"}); }
function toggleLang(){
  lang = (lang === "fa") ? "en" : "fa";
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "fa") ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = (lang === "fa") ? "EN" : "فا";
  render();
}
render();
</script>
